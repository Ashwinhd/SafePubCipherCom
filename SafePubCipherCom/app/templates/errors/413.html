{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div class="cv-card" style="border-color:var(--danger);">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">📦</div>
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color:var(--text-primary);">413 — Payload Too Large</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 2rem;">
            The uploaded file exceeds the maximum allowed payload size of 16 MB. Please upload a smaller asset.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn-cv btn-cv-outline" style="justify-content:center;">Back to Safety</a>
    </div>
</div>
{% endblock %}
